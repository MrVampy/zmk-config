# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# Trimmed from the keebart upstream — this fork only builds for the Corne
# Choc Pro hardware I actually own (no-screen variant with inner-column
# buttons replacing the OLED — see corne_choc_pro.keymap rows 1/2 inner
# positions). `shield: nice_view` was removed because there's no OLED
# installed; building with it would initialize a non-existent display.
# `settings_reset` is kept as a recovery firmware — flashing it wipes NVS
# (clears all BLE bonds), useful if a profile slot gets wedged.
---
include:
  - board: corne_choc_pro_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: corne_choc_pro_right
    snippet: studio-rpc-usb-uart

  - board: corne_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  # Debug firmware: USB CDC ACM logging for observing BLE/profile behavior on
  # the device. Flash only while diagnosing; normal firmware above stays clean.
  - board: corne_choc_pro_left
    snippet: corne-ble-debug
    artifact-name: corne_choc_pro_left_usb_log
  - board: corne_choc_pro_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
    artifact-name: corne_choc_pro_right_usb_log
