# keymap-drawer configuration for the Corne Choc Pro keymap.
#
# Maps the joelspadin/zmk-locales DA_* aliases and our custom behaviors to
# their natural rendered characters, so the generated
# SVG/PNG shows `!` not `DA_EXCL`, `'/"` not the raw key binding, etc.
#
# Applied via `keymap -c keymap-drawer/config.yaml parse ...` during the
# parse step (NOT at draw time — the labels need to be set before the
# parser writes the YAML).

parse_config:
  zmk_keycode_map:
    # Number-row shifted symbols
    DA_ONE_HALF: "½"
    DA_FRAC_1_2: "½"
    DA_EXCL: "!"
    DA_AT: "@"
    DA_HASH: "#"
    DA_DLLR: "$"
    DA_PRCNT: "%"
    DA_PERCENT: "%"
    DA_CARET: "^"
    DA_AMPS: "&"
    DA_ASTRK: "*"
    DA_LPAR: "("
    DA_RPAR: ")"

    # Math / punctuation
    DA_EQUAL: "="
    DA_PLUS: "+"
    DA_MINUS: "-"
    DA_LESS_THAN: "<"
    DA_LT: "<"
    DA_GREATER_THAN: ">"
    DA_GT: ">"
    DA_UNDER: "_"
    DA_SLASH: "/"
    DA_QMARK: "?"
    DA_BSLH: "\\"
    DA_PIPE: "|"

    # Brackets / braces
    DA_LBKT: "["
    DA_RBKT: "]"
    DA_LBRC: "{"
    DA_RBRC: "}"

    # Quotes / accents
    DA_APOS: "'"
    DA_DQT: '"'
    DA_GRAVE: "`"
    DA_TILDE: "~"
    DA_ACUTE: "´"
    DA_UMLAUT: "¨"

    # Currency
    DA_EURO: "€"
    DA_POUND_SIGN: "£"

    # Danish letters
    DA_AE: "æ"
    DA_O_SLASH: "ø"
    DA_A_RING: "å"

    # Native AltGr chords from Linux/XKB Danish.
    RA(COMMA): "ç"
    RA(N1): "¡"
    RA(LS(MINUS)): "¿"
    RA(LS(N8)): "«"
    RA(LS(N9)): "»"

  # Custom behaviors and direct native chords.
  # raw_binding_map applies at parse-time and overrides whatever the
  # parser would have written for these &-prefixed identifiers.
  raw_binding_map:
    "&top_alt_l": {t: "Caps Word", h: LALT}
    "&kp RA(COMMA)": "ç"
    "&kp RA(N1)": "¡"
    "&kp RA(LS(MINUS))": "¿"
    "&kp RA(LS(N8))": "«"
    "&kp RA(LS(N9))": "»"
    "&c_cedilla_morph": "ç/Ç"
    "&oe_ligature_morph": "œ/Œ"
    "&n_tilde_morph": "ñ/Ñ"
    "&s_sharp_morph": "ß/ẞ"
    "&to 0": "LIN"
    "&to 4": "WIN"
    "&to 5": "MAC"
    "&sym_s_umlaut_ss":
      t: |-
        ¨
        ß/ẞ
      h: LCTRL
    "&rgb_ug RGB_TOG": "RGB"
