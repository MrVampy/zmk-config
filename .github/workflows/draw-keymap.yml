name: Draw keymap

on:
  push:
    branches:
      - main
    paths:
      - 'config/*.keymap'
      - 'boards/arm/corne_choc_pro/**'
      - '.github/workflows/draw-keymap.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install keymap-drawer + librsvg
        run: |
          pip install --quiet keymap-drawer
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Generate SVG + PNG
        run: |
          mkdir -p keymap-drawer
          # `-c keymap-drawer/config.yaml` maps zmk-locales DA_* macros and our
          # custom behaviors (apos_dqt, hyp_qm, inv_excl, inv_ques) to their
          # natural rendered characters — so the diagram shows `!` not `DA_EXCL`.
          keymap -c keymap-drawer/config.yaml parse -z config/corne_choc_pro.keymap > keymap-drawer/corne_choc_pro.yaml
          # parser writes a placeholder layout line that doesn't know about
          # Keebart's custom 46-key board; patch it to point at our DTS layout.
          sed -i 's|^layout:.*|layout: {dts_layout: boards/arm/corne_choc_pro/corne_choc_pro-layouts.dtsi, layout_name: default_layout}|' keymap-drawer/corne_choc_pro.yaml
          # -s limits rendering to the three real layers, dropping the unused
          # extra_layer_1..6 templates (all &trans, would render as blank pages).
          # Positional yaml must come BEFORE -s to avoid argparse treating the
          # yaml path as another layer name.
          keymap draw keymap-drawer/corne_choc_pro.yaml -s QWERTY NUMBER SYMBOL > keymap-drawer/corne_choc_pro.svg
          rsvg-convert -w 2400 keymap-drawer/corne_choc_pro.svg -o keymap-drawer/corne_choc_pro.png

      - name: Commit + push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keymap-drawer/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: regenerate keymap diagram [skip ci]"
          git push
