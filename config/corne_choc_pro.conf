# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Change idle settings
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings. ZMK's default deep-sleep timeout is 15 minutes
# (900000 ms); keep the board awake longer during normal desk use.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Custom keyboard name (max. 16 characters)
# CONFIG_ZMK_KEYBOARD_NAME="My Keyboard"

# Standard ZMK underglow. Keep it off at boot for battery life; the SETTINGS
# RGB key toggles the configured solid red color.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100

# Split battery reporting: central (left) reads the peripheral (right) battery
# over the split BLE link and re-publishes it to the host as a second
# Characteristic on the standard 0x180F Battery Service. UPower exposes only
# the first one (the central's own battery) — read the second via D-Bus
# directly (see home/scripts/keyboard-battery.nix in the nix-flake).
# Both flags are guarded by ZMK_SPLIT_ROLE_CENTRAL in upstream Kconfig, so
# only the left-half build picks them up; harmless on the right.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
