# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Change idle settings
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings. Keep ZMK's documented 15-minute default explicit.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Persist setting changes quickly enough that power-management toggles survive
# a normal flash/test cycle.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=5000

# Custom keyboard name (max. 16 characters)
# CONFIG_ZMK_KEYBOARD_NAME="My Keyboard"

# Standard ZMK underglow. Keep it off at boot for battery life; the SETTINGS
# RGB key explicitly turns off underglow and the LED power rail.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100

# BLE security/pairing hardening.
#
# The Corne has repeatedly hit pairing loops where the host reaches LE Secure
# Connections public-key exchange and then aborts with Authentication Failed.
# Force Zephyr's host-side TinyCrypt ECDH path instead of relying on the
# controller's P-256 public-key path.
CONFIG_BT_TINYCRYPT_ECC=y

# Split battery reporting: central (left) reads the peripheral (right) battery
# over the split BLE link and re-publishes it to the host as a second
# Characteristic on the standard 0x180F Battery Service. UPower exposes only
# the first one (the central's own battery) — read the second via D-Bus
# directly (see home/scripts/keyboard-battery.nix in the nix-flake).
# Both flags are guarded by ZMK_SPLIT_ROLE_CENTRAL in upstream Kconfig, so
# only the left-half build picks them up; harmless on the right.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
