# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Change idle settings
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Custom keyboard name (max. 16 characters)
# CONFIG_ZMK_KEYBOARD_NAME="My Keyboard"

# RGB underglow: driver present so RGB_TOG can wake it, but off at boot for
# battery life. PDF warns RGB-on lifetime is "only a few hours"; this keeps
# the LEDs dark by default and the existing RGB_TOG key (NUMBER layer, left
# half bottom row position 3) lights them on demand.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
