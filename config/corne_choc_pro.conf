# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Change idle settings
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Custom keyboard name (max. 16 characters)
# CONFIG_ZMK_KEYBOARD_NAME="My Keyboard"

# RGB underglow: driver present so RGB_TOG can wake it, but off at boot for
# battery life. PDF warns RGB-on lifetime is "only a few hours"; this keeps
# the LEDs dark by default and the existing RGB_TOG key (NUMBER layer, left
# half bottom row position 3) lights them on demand.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Split battery reporting: central (left) reads the peripheral (right) battery
# over the split BLE link and re-publishes it to the host as a second
# Characteristic on the standard 0x180F Battery Service. UPower exposes only
# the first one (the central's own battery) — read the second via D-Bus
# directly (see home/scripts/keyboard-battery.nix in the nix-flake).
# Both flags are guarded by ZMK_SPLIT_ROLE_CENTRAL in upstream Kconfig, so
# only the left-half build picks them up; harmless on the right.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Disable 2 Mbps BLE PHY. ZMK docs flag this as a fix for certain wireless
# chipset firmware versions (notably Intel and Realtek BT controllers on
# Linux/Windows) where the 2M PHY exposes a host-side bug that manifests as
# the "Connected/Paired/Bonded all true but no HID notifications flow" shape
# — same family as upstream zmk#3309 / zmk#1487 and the recurring failure
# this user hits during normal use (not just post-flash). Forces the link
# to stay on the standard 1 Mbps PHY, which has broader stable-firmware
# coverage across host BT chipsets at the cost of slightly higher BLE
# bandwidth utilisation per packet. Cheap to try; reversible.
CONFIG_BT_CTLR_PHY_2M=n
